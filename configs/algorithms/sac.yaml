# SAC (Soft Actor-Critic) configuration
algorithm:
  name: "sac"

  # Learning rates
  actor_lr: 3e-4
  critic_lr: 3e-4
  alpha_lr: 3e-4  # Entropy coefficient learning rate

  # Discount and target update
  gamma: 0.99
  tau: 0.005  # Soft update coefficient

  # Entropy
  init_alpha: 0.2
  auto_entropy_tuning: true
  target_entropy: "auto"  # -dim(A) if auto

  # Network architecture (will be scaled)
  actor_hidden_sizes: [256, 256]
  critic_hidden_sizes: [256, 256]

  # Replay buffer
  buffer_size: 1_000_000

  # Training
  utd_ratio: 1  # Updates per environment step
  batch_size: 256
