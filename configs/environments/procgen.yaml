# Procgen environment configuration
environment:
  domain: "procgen"

  # Default game
  game: "starpilot"

  # Distribution settings
  distribution_mode: "easy"  # easy, hard, extreme
  num_levels: 200  # 0 for unlimited
  start_level: 0

  # Rendering
  use_backgrounds: true
  use_monochrome_assets: false

  # Frame settings
  frame_stack: 1

  # Episode settings
  max_episode_steps: 1000

  # Normalization
  normalize_obs: true

  # Evaluation
  eval_num_levels: 0  # Full distribution

# Available Procgen games for experiments
available_games:
  - "starpilot"
  - "dodgeball"
  - "bigfish"
  - "bossfight"
  - "caveflyer"
  - "chaser"
  - "climber"
  - "coinrun"
  - "fruitbot"
  - "heist"
  - "jumper"
  - "leaper"
  - "maze"
  - "miner"
  - "ninja"
  - "plunder"
