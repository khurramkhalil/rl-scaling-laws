# Phase 2 Domain Comparison
# Compare scaling behavior across all 4 domains

# Atari experiments
atari_sweep:
  defaults:
    - /algorithm: dqn
    - /environment: atari

  hydra:
    sweeper:
      params:
        scaling.target_params: 10000000, 30000000, 100000000, 300000000, 1000000000
        environment.game: Breakout, Pong
        seed: 1, 2, 3, 4, 5

  experiment:
    name: "atari_scaling"
    group: "phase2_domains"

  training:
    total_timesteps: 10_000_000

# DMC experiments
dmc_sweep:
  defaults:
    - /algorithm: sac
    - /environment: dmc

  hydra:
    sweeper:
      params:
        scaling.target_params: 10000000, 30000000, 100000000, 300000000, 1000000000
        environment.domain_name: walker, humanoid
        seed: 1, 2, 3, 4, 5

  experiment:
    name: "dmc_scaling"
    group: "phase2_domains"

  training:
    total_timesteps: 5_000_000

